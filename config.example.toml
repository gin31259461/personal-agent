[app]
timezone = "Asia/Taipei"
max_tool_iterations = 5
database_url = "sqlite+aiosqlite:////var/lib/personal-agent/agent.db"
clarification_ttl_seconds = 600
# instructions_path = "/etc/personal-agent/instructions.md"
instructions_max_bytes = 32768

[discord]
guild_id = 123456789
channel_id = 123456789
owner_user_ids = [123456789]

[llm]
base_url = "http://127.0.0.1:8080/v1"
model = "Qwen3.6-35B-A3B"
temperature = 0.2
max_tokens = 4096
timeout_seconds = 60

[notion.tasks]
data_source_id = "replace-with-tasks-data-source-id"

[notion.finance]
data_source_id = "replace-with-finance-data-source-id"

# Optional per-user Notion overrides. If defined, requests from this Discord user ID
# will dynamically route to these databases instead of the default databases above.
# [notion.users."836446179431677992".tasks]
# data_source_id = "user1-tasks-data-source-id"
# [notion.users."836446179431677992".finance]
# data_source_id = "user1-finance-data-source-id"

[web_search]
# Legacy standalone switch. Nix deployments inject PERSONAL_AGENT_WEB_SEARCH_URL instead.
enabled = false
provider = "searxng"
base_url = "http://127.0.0.1:8888"
timeout_seconds = 15
max_results = 10
max_response_bytes = 262144
