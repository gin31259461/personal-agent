[project]
name = "personal-agent"
version = "0.1.0"
description = "A policy-controlled personal AI assistant for Discord and Notion."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
personal-agent = "personal_agent.main:main"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
